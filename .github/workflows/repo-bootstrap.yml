name: Bootstrap repo metadata

on:
  push:
    paths:
      - ".github/workflows/repo-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  repository-projects: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Configure labels and repository metadata
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const results = { labels: {}, topics: null, settings: null };

            const labels = [
              ["new-project", "1f6feb", "New mashup/project submission"],
              ["verification-needed", "fbca04", "Needs primary-source verification"],
              ["verified", "0e8a16", "Verified against primary sources"],
              ["watchlist", "d93f0b", "Unverified or video-only project being tracked"],
              ["correction", "5319e7", "Correction to existing project data"],
              ["broken-link", "b60205", "A referenced URL is unavailable or broken"],
              ["duplicate", "cfd3d7", "Duplicate submission or issue"]
            ];

            for (const [name, color, description] of labels) {
              try {
                await github.rest.issues.createLabel({ owner, repo, name, color, description });
                results.labels[name] = "created";
              } catch (e) {
                if (e.status === 422) {
                  try {
                    await github.rest.issues.updateLabel({ owner, repo, name, new_name: name, color, description });
                    results.labels[name] = "updated";
                  } catch (u) {
                    results.labels[name] = "failed: " + u.message;
                  }
                } else {
                  results.labels[name] = "failed: " + e.message;
                }
              }
            }

            const topics = [
              "awesome-list",
              "game-modding",
              "mods",
              "game-mashups",
              "game-development",
              "reverse-engineering",
              "game-engine",
              "source-port",
              "recompilation",
              "decompilation",
              "minecraft",
              "skyrim",
              "halo",
              "doom"
            ];

            try {
              await github.rest.repos.replaceAllTopics({ owner, repo, names: topics });
              results.topics = "updated";
            } catch (e) {
              results.topics = "failed: " + e.message;
            }

            try {
              await github.rest.repos.update({
                owner,
                repo,
                has_wiki: false,
                has_projects: false,
                has_discussions: false
              });
              results.settings = "updated";
            } catch (e) {
              results.settings = "failed: " + e.message;
            }

            const body = JSON.stringify(results, null, 2) + "\n";
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: ".github/repo-bootstrap-result.json",
              message: "chore: record repository bootstrap result",
              content: Buffer.from(body).toString("base64")
            });
