name: Check links

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "data/projects.json"
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - "**/*.md"
      - "data/projects.json"

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            "./**/*.md"
            "./data/projects.json"
          fail: true
